name: Validate workspace

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification tools
        run: python -m pip install -r requirements-dev.txt
      - name: Validate workflows and index
        run: python scripts/workspace.py validate
      - name: Unit, integration and CLI tests
        run: python -m coverage run --source=scripts -m unittest discover -s tests -v
      - name: Require 80 percent coverage
        run: python -m coverage report --fail-under=80
      - name: Check publication boundaries
        run: python scripts/check_publication.py --history
      - name: Audit verification dependencies
        run: python -m pip_audit -r requirements-dev.txt
